<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ÉCHANGE SERVICE</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
    --bleu-fonce: #102a43;
    --bleu: #1769aa;
    --gris: #f3f6f8;
    --vert: #167242;
    --rouge: #c0392b;
    --orange: #856404;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: var(--gris);
    color: #17212b;
}

header {
    background:
        linear-gradient(
            135deg,
            var(--bleu-fonce),
            var(--bleu)
        );

    color: white;
    padding: 25px 20px 35px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin-bottom: 0;
    opacity: 0.9;
}

main {
    max-width: 650px;
    margin: -15px auto 100px;
    padding: 0 15px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-top: 15px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.08);
}

.hidden {
    display: none !important;
}

.choice {
    width: 100%;
    padding: 22px;
    margin-top: 15px;

    border-radius: 16px;
    border: 1px solid #e0e6eb;

    background: white;

    font-size: 19px;
    font-weight: bold;

    text-align: left;
}

.choice small {
    display: block;
    margin-top: 5px;

    font-size: 14px;
    font-weight: normal;

    color: #687887;
}

button {
    cursor: pointer;
}

.btn {
    width: 100%;

    padding: 15px;
    margin-top: 10px;

    border: none;
    border-radius: 12px;

    background: var(--bleu);
    color: white;

    font-size: 16px;
    font-weight: bold;
}

.btn-secondaire {
    background: #e8eef4;
    color: #17212b;
}

.btn-interesse {
    background: var(--vert);
}

.btn-danger {
    background: var(--rouge);
}

label {
    display: block;

    font-size: 14px;
    font-weight: bold;

    margin-top: 10px;

    color: #526273;
}

input,
textarea {
    width: 100%;

    padding: 13px;
    margin-top: 5px;

    border-radius: 10px;

    border: 1px solid #ccd6df;

    font-size: 16px;
}

textarea {
    min-height: 80px;
}

.row {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;
}

.item {
    background: #f8fafc;

    border-left:
        5px solid var(--bleu);

    padding: 18px;
    margin-top: 12px;

    border-radius: 10px;
}

.item-info {
    margin-top: 6px;
    line-height: 1.5;
}

.badge {
    display: inline-block;

    background: #e7f5ec;
    color: var(--vert);

    padding: 6px 10px;

    border-radius: 20px;

    font-size: 12px;
    font-weight: bold;
}

.statut-disponible {
    display: inline-block;

    margin-top: 10px;

    padding: 5px 10px;

    border-radius: 20px;

    background: #e7f5ec;
    color: var(--vert);

    font-size: 12px;
    font-weight: bold;
}

.statut-interesse {
    display: inline-block;

    margin-top: 10px;

    padding: 5px 10px;

    border-radius: 20px;

    background: #fff3cd;
    color: var(--orange);

    font-size: 12px;
    font-weight: bold;
}

.message {
    text-align: center;
    padding: 20px;
    color: #687887;
}

nav {
    position: fixed;

    bottom: 0;
    left: 0;
    right: 0;

    background: white;

    border-top:
        1px solid #dfe6ec;

    padding: 8px;

    display: flex;
    justify-content: space-around;

    z-index: 100;
}

nav button {
    border: none;
    background: none;

    color: var(--bleu);

    font-size: 12px;

    padding: 8px;
}

@media (max-width: 500px) {

    .row {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

<h1>🚆 ÉCHANGE SERVICE</h1>

<p>Échange de journées entre agents</p>

</header>



<main>


<!-- =========================
     ACCUEIL
========================= -->

<section id="accueil">

<div class="card">

<h2>Bienvenue 👋</h2>

<p>
Choisissez votre métier pour commencer.
</p>

</div>


<button
class="choice"
onclick="choisirMetier('ADC')">

🚆 ADC

<small>
Conducteurs de train
</small>

</button>


<button
class="choice"
onclick="choisirMetier('ASCT')">

👤 ASCT

<small>
Agents du Service Commercial Train
</small>

</button>


</section>



<!-- =========================
     PROPOSER
========================= -->

<section
id="proposer"
class="hidden">

<div class="card">


<span
id="metier"
class="badge">
</span>


<h2>➕ Ma journée à échanger</h2>


<label>
Nom et prénom
</label>

<input
id="nom"
placeholder="Exemple : Jean DUPONT">


<label>
Date de la journée
</label>

<input
id="date"
type="date">


<div class="row">


<div>

<label>
Prise de service
</label>

<input
id="prise"
type="time">

</div>


<div>

<label>
Fin de service
</label>

<input
id="fin"
type="time">

</div>


</div>


<label>
Commentaire facultatif
</label>

<textarea
id="commentaire"
placeholder="Exemple : TER, réserve..."></textarea>


<button
class="btn"
onclick="publier()">

🚆 PUBLIER MA JOURNÉE

</button>


<button
class="btn btn-secondaire"
onclick="afficher('echanges')">

🔎 VOIR LES ÉCHANGES

</button>


</div>

</section>



<!-- =========================
     ECHANGES
========================= -->

<section
id="echanges"
class="hidden">

<div class="card">


<h2>
🔎 Échanges disponibles
</h2>


<p>

Métier :

<strong
id="metierEchanges">
</strong>

</p>


<div
id="listeEchanges">
</div>


<button
class="btn btn-secondaire"
onclick="afficher('proposer')">

➕ PROPOSER UNE JOURNÉE

</button>


</div>

</section>



<!-- =========================
     INTERETS
========================= -->

<section
id="interets"
class="hidden">

<div class="card">


<h2>
⭐ Journées avec intérêt
</h2>


<div
id="listeInterets">
</div>


<button
class="btn btn-secondaire"
onclick="afficher('echanges')">

🔎 RETOUR AUX ÉCHANGES

</button>


</div>

</section>


</main>



<!-- =========================
     MENU
========================= -->

<nav
id="menu"
class="hidden">


<button
onclick="afficher('proposer')">

➕<br>
Ma journée

</button>


<button
onclick="afficher('echanges')">

🔎<br>
Échanges

</button>


<button
onclick="afficher('interets')">

⭐<br>
Intérêts

</button>


<button
onclick="changerMetier()">

🚆<br>
Métier

</button>


</nav>



<script>


/* =========================
   CONFIGURATION SUPABASE
========================= */

const SUPABASE_URL =
    "https://nptwpoguokbjuzdyxach.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_VxIiVyjGPVxipQx8j5njxA_YxaFOnAF";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   VARIABLES
========================= */

let metierActuel = "";


/* =========================
   AFFICHER PAGE
========================= */

async function afficher(page) {


    document
    .querySelectorAll("main section")
    .forEach(section => {

        section
        .classList
        .add("hidden");

    });


    document
    .getElementById(page)
    .classList
    .remove("hidden");


    if (page === "echanges") {

        await afficherEchanges();

    }


    if (page === "interets") {

        await afficherInterets();

    }

}


/* =========================
   CHOISIR METIER
========================= */

function choisirMetier(metier) {


    metierActuel = metier;


    document
    .getElementById("metier")
    .innerText = metier;


    document
    .getElementById("metierEchanges")
    .innerText = metier;


    document
    .getElementById("menu")
    .classList
    .remove("hidden");


    afficher("proposer");

}


/* =========================
   CHANGER METIER
========================= */

function changerMetier() {


    metierActuel = "";


    document
    .getElementById("menu")
    .classList
    .add("hidden");


    afficher("accueil");

}


/* =========================
   PUBLIER JOURNEE
========================= */

async function publier() {


    const nom =
    document
    .getElementById("nom")
    .value
    .trim();


    const date =
    document
    .getElementById("date")
    .value;


    const prise =
    document
    .getElementById("prise")
    .value;


    const fin =
    document
    .getElementById("fin")
    .value;


    const commentaire =
    document
    .getElementById("commentaire")
    .value
    .trim();


    if (

        !nom ||

        !date ||

        !prise ||

        !fin

    ) {

        alert(
        "Merci de remplir le nom, la date et les horaires."
        );

        return;

    }


    const { error } =
    await supabaseClient

    .from("echanges")

    .insert([

        {

            metier:
            metierActuel,

            nom:
            nom,

            date_service:
            date,

            prise_service:
            prise,

            fin_service:
            fin,

            commentaire:
            commentaire,

            statut:
            "disponible",

            agent_interesse:
            null

        }

    ]);


    if (error) {

        console.error(error);

        alert(
        "❌ Erreur : " +
        error.message
        );

        return;

    }


    document
    .getElementById("nom")
    .value = "";


    document
    .getElementById("date")
    .value = "";


    document
    .getElementById("prise")
    .value = "";


    document
    .getElementById("fin")
    .value = "";


    document
    .getElementById("commentaire")
    .value = "";


    alert(
    "✅ Votre journée est publiée !"
    );


    await afficher("echanges");

}


/* =========================
   RECUPERER ECHANGES
========================= */

async function afficherEchanges() {


    const zone =
    document
    .getElementById(
    "listeEchanges"
    );


    document
    .getElementById(
    "metierEchanges"
    )
    .innerText =
    metierActuel;


    zone.innerHTML =
    "<div class='message'>Chargement...</div>";


    const { data, error } =
    await supabaseClient

    .from("echanges")

    .select("*")

    .eq(
    "metier",
    metierActuel
    )

    .eq(
    "statut",
    "disponible"
    )

    .order(
    "date_service",
    {
        ascending: true
    }
    );


    if (error) {

        console.error(error);

        zone.innerHTML =
        "<div class='message'>❌ Erreur de chargement</div>";

        return;

    }


    /*
    IMPORTANT

    ON VIDE COMPLETEMENT
    LA LISTE AVANT
    DE LA RECONSTRUIRE
    */

    zone.innerHTML = "";


    if (

        !data ||

        data.length === 0

    ) {

        zone.innerHTML =
        "<div class='message'>Aucune journée proposée pour le moment.</div>";

        return;

    }


    data.forEach(echange => {


        creerCarteEchange(

        echange,

        zone,

        false

        );


    });

}


/* =========================
   RECUPERER INTERETS
========================= */

async function afficherInterets() {


    const zone =
    document
    .getElementById(
    "listeInterets"
    );


    zone.innerHTML =
    "<div class='message'>Chargement...</div>";


    const { data, error } =
    await supabaseClient

    .from("echanges")

    .select("*")

    .eq(
    "metier",
    metierActuel
    )

    .eq(
    "statut",
    "interesse"
    )

    .order(
    "date_service",
    {
        ascending: true
    }
    );


    if (error) {

        console.error(error);

        zone.innerHTML =
        "<div class='message'>❌ Erreur de chargement</div>";

        return;

    }


    zone.innerHTML = "";


    if (

        !data ||

        data.length === 0

    ) {

        zone.innerHTML =
        "<div class='message'>Aucune journée avec intérêt pour le moment.</div>";

        return;

    }


    data.forEach(echange => {


        creerCarteEchange(

        echange,

        zone,

        true

        );


    });

}


/* =========================
   CREER CARTE ECHANGE
========================= */

function creerCarteEchange(
echange,
zone,
estInteret
) {


    const bloc =
    document
    .createElement("div");


    bloc.className =
    "item";


    /*
    IDENTIFIANT UNIQUE
    */

    bloc.id =
    "echange-" +
    echange.id;


    let contenu = "";


    contenu +=
    "<strong>" +

    echange.nom +

    "</strong>";


    contenu +=
    "<div class='item-info'>";


    contenu +=
    "📅 " +

    echange.date_service;


    contenu +=
    "<br>";


    contenu +=
    "⏰ " +

    formatHeure(
    echange.prise_service
    );


    contenu +=
    " → ";


    contenu +=
    formatHeure(
    echange.fin_service
    );


    contenu +=
    "</div>";


    if (echange.commentaire) {

        contenu +=
        "<div class='item-info'>💬 " +

        echange.commentaire +

        "</div>";

    }


    if (estInteret) {


        contenu +=
        "<div class='item-info'>";


        contenu +=
        "🤝 Agent intéressé : ";


        contenu +=
        "<strong>" +

        (
            echange.agent_interesse ||
            "Non renseigné"
        ) +

        "</strong>";


        contenu +=
        "</div>";


        contenu +=
        "<span class='statut-interesse'>";


        contenu +=
        "🟠 Agent intéressé";


        contenu +=
        "</span>";

    }

    else {


        contenu +=
        "<span class='statut-disponible'>";


        contenu +=
        "🟢 Disponible";


        contenu +=
        "</span>";


        contenu +=
        "<button " +

        "class='btn btn-interesse' " +

        "onclick='jeSuisInteresse(" +

        echange.id +

        ")'>";


        contenu +=
        "🤝 JE SUIS INTÉRESSÉ";


        contenu +=
        "</button>";

    }


    /*
    BOUTON SUPPRIMER
    */

    contenu +=
    "<button " +

    "class='btn btn-danger' " +

    "onclick='supprimerDemande(" +

    echange.id +

    ")'>";


    contenu +=
    "🗑️ SUPPRIMER";


    contenu +=
    "</button>";


    bloc.innerHTML =
    contenu;


    zone.appendChild(
    bloc
    );

}


/* =========================
   JE SUIS INTERESSE
========================= */

async function jeSuisInteresse(id) {


    let agent =
    prompt(
    "Indiquez votre nom et prénom :"
    );


    if (agent === null) {

        return;

    }


    agent =
    agent.trim();


    if (!agent) {

        alert(
        "Merci d'indiquer votre nom."
        );

        return;

    }


    const { error } =
    await supabaseClient

    .from("echanges")

    .update({

        statut:
        "interesse",

        agent_interesse:
        agent

    })

    .eq(
    "id",
    id
    );


    if (error) {

        console.error(error);

        alert(
        "❌ Erreur : " +
        error.message
        );

        return;

    }


    alert(
    "✅ Votre intérêt a été enregistré !"
    );


    /*
    RECHARGEMENT COMPLET
    */

    await afficherEchanges();

}


/* =========================
   SUPPRIMER DEMANDE
========================= */

async function supprimerDemande(id) {


    const confirmation =
    confirm(
    "⚠️ Voulez-vous vraiment supprimer cette demande ?"
    );


    if (!confirmation) {

        return;

    }


    /*
    DESACTIVER
    EVENTUELLEMENT LE
    BOUTON PENDANT
    LA SUPPRESSION
    */

    console.log(
    "Tentative de suppression :",
    id
    );


    /*
    SUPPRESSION
    */

    const { data, error } =
    await supabaseClient

    .from("echanges")

    .delete()

    .eq(
    "id",
    id
    )

    .select();


    if (error) {

        console.error(
        "Erreur Supabase :",
        error
        );


        alert(
        "❌ Erreur lors de la suppression : " +
        error.message
        );

        return;

    }


    /*
    VERIFICATION

    Si aucune ligne
    n'est retournée,
    la suppression
    n'a probablement
    pas été autorisée.
    */

    if (

        !data ||

        data.length === 0

    ) {

        alert(
        "⚠️ La suppression n'a pas été confirmée par Supabase."
        );

        return;

    }


    console.log(
    "Suppression confirmée :",
    data
    );


    /*
    SUPPRESSION VISUELLE
    IMMEDIATE
    */

    const element =
    document
    .getElementById(
    "echange-" +
    id
    );


    if (element) {

        element.remove();

    }


    /*
    RECHARGEMENT
    DEPUIS SUPABASE
    */

    const pageInterets =
    !document
    .getElementById("interets")
    .classList
    .contains("hidden");


    if (pageInterets) {

        await afficherInterets();

    }

    else {

        await afficherEchanges();

    }


    alert(
    "🗑️ La demande a été supprimée."
    );

}


/* =========================
   FORMAT HEURE
========================= */

function formatHeure(heure) {


    if (!heure) {

        return "";

    }


    return
    heure.substring(0,5);

}


</script>


</body>

</html>
