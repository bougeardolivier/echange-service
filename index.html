<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ÉCHANGE SERVICE</title>

<style>

:root {
    --bleu-fonce: #102a43;
    --bleu: #1769aa;
    --gris: #f3f6f8;
    --blanc: #ffffff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--gris);
    color: #17212b;
}

header {
    background: linear-gradient(135deg, var(--bleu-fonce), var(--bleu));
    color: white;
    padding: 25px 20px 35px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin-bottom: 0;
    opacity: 0.9;
}

main {
    max-width: 650px;
    margin: -15px auto 90px;
    padding: 0 15px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-top: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.hidden {
    display: none;
}

.choice {
    width: 100%;
    padding: 22px;
    margin-top: 15px;

    border-radius: 16px;
    border: 1px solid #e0e6eb;

    background: white;

    font-size: 19px;
    font-weight: bold;

    text-align: left;
}

.choice small {
    display: block;
    margin-top: 5px;

    font-size: 14px;
    font-weight: normal;

    color: #687887;
}

button {
    cursor: pointer;
}

.btn {
    width: 100%;

    padding: 15px;
    margin-top: 10px;

    border: none;
    border-radius: 12px;

    background: var(--bleu);

    color: white;

    font-size: 16px;
    font-weight: bold;
}

.btn-secondaire {
    background: #e8eef4;
    color: #17212b;
}

label {
    display: block;

    font-size: 14px;
    font-weight: bold;

    margin-top: 10px;

    color: #526273;
}

input,
textarea {

    width: 100%;

    padding: 13px;

    margin-top: 5px;

    border-radius: 10px;

    border: 1px solid #ccd6df;

    font-size: 16px;

}

.row {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

}

.item {

    background: #f8fafc;

    border-left: 5px solid var(--bleu);

    padding: 15px;

    margin-top: 12px;

    border-radius: 8px;

}

.badge {

    display: inline-block;

    background: #e7f5ec;

    color: #167242;

    padding: 6px 10px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

}

nav {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    background: white;

    border-top: 1px solid #dfe6ec;

    padding: 8px;

    display: flex;

    justify-content: space-around;

}

nav button {

    border: none;

    background: none;

    font-size: 12px;

    padding: 8px;

}

</style>

</head>


<body>


<header>

<h1>🚆 ÉCHANGE SERVICE</h1>

<p>Échange de journées entre agents</p>

</header>



<main>


<!-- ACCUEIL -->

<section id="accueil">

<div class="card">

<h2>Bienvenue 👋</h2>

<p>

Choisissez votre métier pour commencer.

</p>

</div>


<button class="choice" onclick="choisirMetier('ADC')">

🚆 ADC

<small>Conducteurs de train</small>

</button>



<button class="choice" onclick="choisirMetier('ASCT')">

👤 ASCT

<small>Agents du Service Commercial Train</small>

</button>


</section>




<!-- PROPOSER JOURNEE -->

<section id="proposer" class="hidden">


<div class="card">


<span id="metier" class="badge"></span>


<h2>➕ Ma journée à échanger</h2>



<label>

Nom et prénom

</label>

<input

id="nom"

placeholder="Exemple : Jean DUPONT"

>



<label>

Date de la journée

</label>

<input

id="date"

type="date"

>



<div class="row">


<div>

<label>

Prise de service

</label>

<input

id="prise"

type="time"

>

</div>



<div>

<label>

Fin de service

</label>

<input

id="fin"

type="time"

>

</div>


</div>



<label>

Commentaire facultatif

</label>


<textarea

id="commentaire"

placeholder="Exemple : TER, réserve..."

>

</textarea>



<button

class="btn"

onclick="publier()"

>

🚆 PUBLIER MA JOURNÉE

</button>



<button

class="btn btn-secondaire"

onclick="afficher('echanges')"

>

🔎 VOIR LES ÉCHANGES

</button>


</div>


</section>





<!-- ECHANGES -->

<section

id="echanges"

class="hidden"

>


<div class="card">


<h2>

🔎 Échanges disponibles

</h2>



<div

id="listeEchanges"

>

</div>



<button

class="btn btn-secondaire"

onclick="afficher('proposer')"

>

➕ PROPOSER UNE JOURNÉE

</button>


</div>


</section>



</main>




<nav

id="menu"

class="hidden"

>


<button

onclick="afficher('proposer')"

>

➕ Ma journée

</button>



<button

onclick="afficher('echanges')"

>

🔎 Échanges

</button>



<button

onclick="changerMetier()"

>

🚆 Métier

</button>


</nav>




<script>


let metierActuel = "";



let echanges = JSON.parse(

localStorage.getItem(

"echangeService"

)

|| "[]"

);




function afficher(page) {


document

.querySelectorAll("main section")

.forEach(

section => {

section.classList.add("hidden");

}

);



document

.getElementById(page)

.classList.remove("hidden");



if(page === "echanges") {

afficherEchanges();

}


}





function choisirMetier(metier) {


metierActuel = metier;



document

.getElementById("metier")

.innerText = metier;



document

.getElementById("menu")

.classList.remove("hidden");



afficher("proposer");


}





function changerMetier() {


document

.getElementById("menu")

.classList.add("hidden");



afficher("accueil");


}





function publier() {


let nouvelEchange = {


id:

Date.now(),


metier:

metierActuel,


nom:

document

.getElementById("nom")

.value,


date:

document

.getElementById("date")

.value,


prise:

document

.getElementById("prise")

.value,


fin:

document

.getElementById("fin")

.value,


commentaire:

document

.getElementById("commentaire")

.value


};




if(

!nouvelEchange.nom

||

!nouvelEchange.date

||

!nouvelEchange.prise

||

!nouvelEchange.fin

) {


alert(

"Merci de remplir le nom, la date et les horaires."

);


return;


}




echanges.push(

nouvelEchange

);



localStorage.setItem(

"echangeService",

JSON.stringify(

echanges

)

);




document

.getElementById("nom")

.value = "";



document

.getElementById("date")

.value = "";



document

.getElementById("prise")

.value = "";



document

.getElementById("fin")

.value = "";



document

.getElementById("commentaire")

.value = "";



alert(

"Votre journée est publiée !"

);



afficher(

"echanges"

);


}





function afficherEchanges() {


let liste =

echanges.filter(

echange =>

echange.metier ===

metierActuel

);




let zone =

document.getElementById(

"listeEchanges"

);




zone.innerHTML = "";




if(

liste.length === 0

) {


zone.innerHTML =

"<p>Aucune journée proposée pour le moment.</p>";


return;


}




liste.forEach(

echange => {


let bloc =

document.createElement(

"div"

);



bloc.className =

"item";



bloc.innerHTML =

"<strong>"

+

echange.nom

+

"</strong>"

+

"<br>"

+

"📅 "

+

echange.date

+

"<br>"

+

"⏰ "

+

echange.prise

+

" → "

+

echange.fin

+

"<br>"

+

"<small>"

+

echange.commentaire

+

"</small>";




zone.appendChild(

bloc

);


}


);


}


</script>



</body>

</html>
