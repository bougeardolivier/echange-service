<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ÉCHANGE SERVICE</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

:root {
    --bleu-fonce: #102a43;
    --bleu: #1769aa;
    --gris: #f3f6f8;
    --blanc: #ffffff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: var(--gris);
    color: #17212b;
}


/* =========================
   EN-TÊTE
========================= */

header {

    background:
        linear-gradient(
            135deg,
            var(--bleu-fonce),
            var(--bleu)
        );

    color: white;

    padding: 25px 20px 35px;

    text-align: center;

}

header h1 {

    margin: 0;

    font-size: 28px;

}

header p {

    margin-bottom: 0;

    opacity: 0.9;

}


/* =========================
   CONTENU
========================= */

main {

    max-width: 650px;

    margin: -15px auto 90px;

    padding: 0 15px;

}


.card {

    background: white;

    border-radius: 18px;

    padding: 20px;

    margin-top: 15px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.08);

}


.hidden {

    display: none;

}


/* =========================
   CHOIX MÉTIER
========================= */

.choice {

    width: 100%;

    padding: 22px;

    margin-top: 15px;

    border-radius: 16px;

    border:
        1px solid #e0e6eb;

    background: white;

    font-size: 19px;

    font-weight: bold;

    text-align: left;

}


.choice small {

    display: block;

    margin-top: 5px;

    font-size: 14px;

    font-weight: normal;

    color: #687887;

}


button {

    cursor: pointer;

}


/* =========================
   BOUTONS
========================= */

.btn {

    width: 100%;

    padding: 15px;

    margin-top: 10px;

    border: none;

    border-radius: 12px;

    background: var(--bleu);

    color: white;

    font-size: 16px;

    font-weight: bold;

}


.btn-secondaire {

    background: #e8eef4;

    color: #17212b;

}


/* =========================
   FORMULAIRE
========================= */

label {

    display: block;

    font-size: 14px;

    font-weight: bold;

    margin-top: 10px;

    color: #526273;

}


input,
textarea {

    width: 100%;

    padding: 13px;

    margin-top: 5px;

    border-radius: 10px;

    border:
        1px solid #ccd6df;

    font-size: 16px;

}


textarea {

    min-height: 90px;

}


.row {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

}


/* =========================
   ÉCHANGES
========================= */

.item {

    background: #f8fafc;

    border-left:
        5px solid var(--bleu);

    padding: 15px;

    margin-top: 12px;

    border-radius: 8px;

}


.badge {

    display: inline-block;

    background: #e7f5ec;

    color: #167242;

    padding: 6px 10px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

}


/* =========================
   MENU BAS
========================= */

nav {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    background: white;

    border-top:
        1px solid #dfe6ec;

    padding: 8px;

    display: flex;

    justify-content: space-around;

}


nav button {

    border: none;

    background: none;

    font-size: 12px;

    padding: 8px;

    color: #17212b;

}


/* =========================
   MOBILE
========================= */

@media
(max-width: 500px) {

    header h1 {

        font-size: 24px;

    }

}

</style>

</head>



<body>


<!-- =========================
     EN-TÊTE
========================= -->

<header>

<h1>
🚆 ÉCHANGE SERVICE
</h1>

<p>
Échange de journées entre agents
</p>

</header>



<!-- =========================
     CONTENU PRINCIPAL
========================= -->

<main>


<!-- =========================
     ACCUEIL
========================= -->

<section
id="accueil"
>


<div class="card">

<h2>
Bienvenue 👋
</h2>

<p>
Choisissez votre métier pour commencer.
</p>

</div>



<button
class="choice"
onclick="choisirMetier('ADC')"
>

🚆 ADC

<small>
Conducteurs de train
</small>

</button>



<button
class="choice"
onclick="choisirMetier('ASCT')"
>

👤 ASCT

<small>
Agents du Service Commercial Train
</small>

</button>


</section>



<!-- =========================
     PROPOSER UNE JOURNÉE
========================= -->

<section
id="proposer"
class="hidden"
>


<div class="card">


<span
id="metier"
class="badge"
>
</span>



<h2>
➕ Ma journée à échanger
</h2>



<label>
Nom et prénom
</label>


<input
id="nom"
placeholder="Exemple : Jean DUPONT"
/>



<label>
Date de la journée
</label>


<input
id="date"
type="date"
/>



<div class="row">


<div>

<label>
Prise de service
</label>


<input
id="prise"
type="time"
/>

</div>



<div>

<label>
Fin de service
</label>


<input
id="fin"
type="time"
/>

</div>


</div>



<label>
Commentaire facultatif
</label>


<textarea
id="commentaire"
placeholder="Exemple : TER, réserve..."
></textarea>



<button
class="btn"
onclick="publier()"
>

🚆 PUBLIER MA JOURNÉE

</button>



<button
class="btn btn-secondaire"
onclick="afficher('echanges')"
>

🔎 VOIR LES ÉCHANGES

</button>


</div>


</section>



<!-- =========================
     LISTE DES ÉCHANGES
========================= -->

<section
id="echanges"
class="hidden"
>


<div class="card">


<h2>
🔎 Échanges disponibles
</h2>


<p>

Métier :

<strong
id="metierEchanges"
>
</strong>

</p>



<div
id="listeEchanges"
>
</div>



<button
class="btn btn-secondaire"
onclick="afficher('proposer')"
>

➕ PROPOSER UNE JOURNÉE

</button>


</div>


</section>


</main>



<!-- =========================
     MENU BAS
========================= -->

<nav
id="menu"
class="hidden"
>


<button
onclick="afficher('proposer')"
>

➕
<br>
Ma journée

</button>



<button
onclick="afficher('echanges')"
>

🔎
<br>
Échanges

</button>



<button
onclick="changerMetier()"
>

🚆
<br>
Métier

</button>


</nav>



<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/* =========================
   CONFIGURATION SUPABASE
========================= */


const SUPABASE_URL =
"https://nptwpoguokbjuzdyxach.supabase.co";


const SUPABASE_KEY =
"COLLE_ICI_TA_PUBLISHABLE_KEY";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* =========================
   MÉTIER ACTUEL
========================= */


let metierActuel = "";



/* =========================
   AFFICHER UNE PAGE
========================= */


function afficher(page) {


    document
        .querySelectorAll("main section")
        .forEach(
            section => {

                section
                    .classList
                    .add("hidden");

            }
        );


    document
        .getElementById(page)
        .classList
        .remove("hidden");



    if (
        page === "echanges"
    ) {

        document
            .getElementById(
                "metierEchanges"
            )
            .innerText =
            metierActuel;


        afficherEchanges();

    }


}



/* =========================
   CHOISIR LE MÉTIER
========================= */


function choisirMetier(metier) {


    metierActuel = metier;



    document
        .getElementById(
            "metier"
        )
        .innerText =
        metier;



    document
        .getElementById(
            "menu"
        )
        .classList
        .remove("hidden");



    afficher("proposer");


}



/* =========================
   CHANGER DE MÉTIER
========================= */


function changerMetier() {


    metierActuel = "";



    document
        .getElementById(
            "menu"
        )
        .classList
        .add("hidden");



    afficher("accueil");


}



/* =========================
   PUBLIER UNE JOURNÉE
========================= */


async function publier() {


    const nom =

        document
        .getElementById("nom")
        .value
        .trim();



    const date =

        document
        .getElementById("date")
        .value;



    const prise =

        document
        .getElementById("prise")
        .value;



    const fin =

        document
        .getElementById("fin")
        .value;



    const commentaire =

        document
        .getElementById("commentaire")
        .value
        .trim();



    /* =====================
       VÉRIFICATION
    ===================== */


    if (

        !nom ||

        !date ||

        !prise ||

        !fin

    ) {


        alert(

            "Merci de remplir le nom, la date et les horaires."

        );


        return;


    }



    /* =====================
       ENVOI SUPABASE
    ===================== */


    const {

        error

    } = await supabaseClient

        .from("echanges")

        .insert([

            {

                metier:
                metierActuel,


                nom:
                nom,


                date_service:
                date,


                prise_service:
                prise,


                fin_service:
                fin,


                commentaire:
                commentaire,


                statut:
                "disponible"


            }

        ]);



    /* =====================
       ERREUR
    ===================== */


    if (error) {


        console.error(error);


        alert(

            "❌ Erreur : "
            +
            error.message

        );


        return;


    }



    /* =====================
       NETTOYAGE FORMULAIRE
    ===================== */


    document
        .getElementById("nom")
        .value = "";



    document
        .getElementById("date")
        .value = "";



    document
        .getElementById("prise")
        .value = "";



    document
        .getElementById("fin")
        .value = "";



    document
        .getElementById("commentaire")
        .value = "";



    /* =====================
       CONFIRMATION
    ===================== */


    alert(

        "✅ Votre journée est publiée !"

    );



    afficher(
        "echanges"
    );


}



/* =========================
   AFFICHER LES ÉCHANGES
========================= */


async function afficherEchanges() {


    const zone =

        document
        .getElementById(
            "listeEchanges"
        );



    /* =====================
       CHARGEMENT
    ===================== */


    zone.innerHTML =

        "<p>Chargement...</p>";



    /* =====================
       LECTURE SUPABASE
    ===================== */


    const {

        data,

        error

    } = await supabaseClient

        .from("echanges")

        .select("*")

        .eq(
            "metier",
            metierActuel
        )

        .eq(
            "statut",
            "disponible"
        )

        .order(
            "date_service",
            {

                ascending:
                true

            }
        );



    /* =====================
       ERREUR
    ===================== */


    if (error) {


        console.error(error);


        zone.innerHTML =

            "<p>❌ Erreur lors du chargement : "

            +

            error.message

            +

            "</p>";


        return;


    }



    /* =====================
       AUCUN ÉCHANGE
    ===================== */


    if (

        !data ||

        data.length === 0

    ) {


        zone.innerHTML =

            "<p>Aucune journée proposée pour le moment.</p>";


        return;


    }



    /* =====================
       AFFICHAGE
    ===================== */


    zone.innerHTML = "";



    data.forEach(
        echange => {


            const bloc =

                document
                .createElement(
                    "div"
                );



            bloc.className =

                "item";



            bloc.innerHTML =


                "<strong>"

                +

                echange.nom

                +

                "</strong>"


                +

                "<br>"


                +

                "📅 "


                +

                echange.date_service


                +

                "<br>"


                +

                "⏰ "


                +

                echange.prise_service


                +

                " → "


                +

                echange.fin_service


                +

                "<br>"


                +

                "<small>"


                +

                (
                    echange.commentaire
                    ||
                    ""
                )


                +

                "</small>";



            zone
                .appendChild(
                    bloc
                );


        }
    );


}


</script>



</body>

</html>
