<style>

main {

/* =========================================

========================================= */

.interesse {

.actions {

}


.btn-interesse {

    background:

}


.btn-interesse:active,

.btn-supprimer:active {

    transform:

}


/* =========================================
   CHARGEMENT
========================================= */

.loading {

    text-align: center;

}


/* =========================================
   EMPTY
========================================= */

.empty {

    text-align: center;

    padding:

        35px
        15px;

}


.empty-icon {

    font-size: 45px;

    margin-bottom: 10px;

}


/* =========================================
   NAVIGATION
========================================= */

nav {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    z-index: 100;

    background:

        rgba(255,255,255,0.96);

        blur(15px);

    border-top:

        1px solid
        #dce5ec;

        8px

        calc(8px + env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));

    display: flex;

    justify-content: space-around;

        0 -8px 30px

}


nav button {

/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 500px) {

    header {

        padding-top: 35px;

    }

        font-size: 16px;

    }

    }

        grid-template-columns: 1fr;

    }


    .actions {

        grid-template-columns: 1fr;

    }

}


</style>

<!-- =========================================

<script>


/* =========================================
   SUPABASE
========================================= */


const SUPABASE_URL =

"https://nptwpoguokbjuzdyxach.supabase.co";


const SUPABASE_KEY =

"sb_publishable_VxIiVyjGPVxipQx8j5njxA_YxaFOnAF";


const supabaseClient =

supabase.createClient(

SUPABASE_URL,

SUPABASE_KEY

);



/* =========================================
   VARIABLES
========================================= */


let metierActuel = "";



/* =========================================
   AFFICHER UNE PAGE
========================================= */


function afficher(page) {


document

.querySelectorAll("main section")

.forEach(

section => {


section

.classList

.add("hidden");


}

);



document

.getElementById(page)

.classList

.remove("hidden");



if(

page === "echanges"

) {


afficherEchanges();


}


}



/* =========================================
   CHOISIR METIER
========================================= */


function choisirMetier(metier) {


metierActuel = metier;



document

.getElementById("metier")

.innerText =

metier;



document

.getElementById("menu")

.classList

.remove("hidden");



afficher("proposer");


}



/* =========================================
   CHANGER METIER
========================================= */


function changerMetier() {


metierActuel = "";



document

.getElementById("menu")

.classList

.add("hidden");



afficher("accueil");


}



/* =========================================
   PUBLIER UNE JOURNEE
========================================= */


async function publier() {


const nom =

document

.getElementById("nom")

.value

.trim();



const date =

document

.getElementById("date")

.value;



const prise =

document

.getElementById("prise")

.value;



const fin =

document

.getElementById("fin")

.value;



const commentaire =

document

.getElementById("commentaire")

.value

.trim();




/* VERIFICATION */


if(

!nom ||

!date ||

!prise ||

!fin

) {


alert(

"Merci de remplir le nom, la date et les horaires."

);


return;


}




/* INSERTION SUPABASE */


const {

error

}

=

await supabaseClient

.from("echanges")

.insert([


{


metier:

metierActuel,


nom:

nom,


date_service:

date,


prise_service:

prise,


fin_service:

fin,


commentaire:

commentaire,


statut:

"disponible",


agent_interesse:

null


}


]);




/* ERREUR */


if(error) {


console.error(error);



alert(

"Erreur lors de la publication : "

+

error.message

);


return;


}




/* NETTOYAGE FORMULAIRE */


document

.getElementById("nom")

.value = "";



document

.getElementById("date")

.value = "";



document

.getElementById("prise")

.value = "";



document

.getElementById("fin")

.value = "";



document

.getElementById("commentaire")

.value = "";



alert(

"🚆 Votre journée est publiée !"

);



afficher("echanges");


}



/* =========================================
   AFFICHER LES ECHANGES
========================================= */


async function afficherEchanges() {


const zone =

document

.getElementById("listeEchanges");



const metierAffiche =

document

.getElementById("metierAffiche");



metierAffiche.innerHTML =

"🚆 Métier : <strong>"

+

metierActuel

+

"</strong>";



zone.innerHTML =

'<div class="loading">🚆 Chargement des échanges...</div>';




const {

data,

error

}

=

await supabaseClient

.from("echanges")

.select("*")

.eq(

"metier",

metierActuel

)

.eq(

"statut",

"disponible"

)

.order(

"date_service",

{

ascending: true

}

);




/* ERREUR */


if(error) {


console.error(error);



zone.innerHTML =

"<p>❌ Erreur lors du chargement : "

+

error.message

+

"</p>";


return;


}




/* VIDE */


if(

!data ||

data.length === 0

) {


zone.innerHTML =

`

<div class="empty">

<div class="empty-icon">

🚉

</div>

<strong>

Aucune journée proposée

</strong>

<p>

Soyez le premier à proposer une journée !

</p>

</div>

`;


return;


}




/* NETTOYAGE */


zone.innerHTML = "";




/* CREATION DES CARTES */


data.forEach(


echange => {


const bloc =

document.createElement("div");


bloc.className =

"item";



/* HEADER */


const header =

document.createElement("div");


header.className =

"item-header";



const nom =

document.createElement("div");


nom.className =

"nom-agent";


nom.textContent =

echange.nom;



const status =

document.createElement("div");


status.className =

"status";


status.textContent =

"✓ DISPONIBLE";



header.appendChild(nom);

header.appendChild(status);



bloc.appendChild(header);



/* INFORMATIONS */


const info =

document.createElement("div");


info.className =

"info";


info.innerHTML =

"📅 <strong>"

+

formatDate(

echange.date_service

)

+

"</strong>"

+

"<br>"

+

"⏰ "

+

formatHeure(

echange.prise_service

)

+

" → "

+

formatHeure(

echange.fin_service

);



bloc.appendChild(info);




/* COMMENTAIRE */


if(

echange.commentaire

) {


const commentaire =

document.createElement("div");


commentaire.className =

"commentaire";


commentaire.textContent =

"💬 "

+

echange.commentaire;



bloc.appendChild(commentaire);


}




/* AGENT INTERESSE */


if(

echange.agent_interesse

) {


const interesse =

document.createElement("div");


interesse.className =

"interesse";


interesse.textContent =

"🙋 Agent intéressé : "

+

echange.agent_interesse;



bloc.appendChild(interesse);


}




/* ACTIONS */


const actions =

document.createElement("div");


actions.className =

"actions";




/* =========================================
   BOUTON JE SUIS INTERESSE
========================================= */


if(

!echange.agent_interesse

) {


const boutonInteresse =

document.createElement("button");


boutonInteresse.className =

"btn-interesse";


boutonInteresse.textContent =

/* =========================================
   JE SUIS INTERESSE
========================================= */


async function seDeclarerInteresse(id) {


const nomInteresse =

prompt(

"Indiquez votre nom et prénom :"

);




if(

!nomInteresse

) {


return;


}




if(

nomInteresse.trim() === ""

) {


return;


}




const confirmation =

confirm(

"Confirmer votre intérêt pour cet échange ?"

);



if(

!confirmation

) {


return;


}




const {

error

}

=

await supabaseClient

.from("echanges")

.update({


agent_interesse:

nomInteresse.trim()


})

.eq(

"id",

id

);




if(error) {


console.error(error);



alert(

"❌ Erreur : "

+

error.message

);


return;


}




alert(

"✓ Votre nom a été ajouté à la demande."

);


/*

IMPORTANT :

On recharge simplement la liste.

La demande reste DISPONIBLE.

On ne modifie PAS le statut.

Elle doit donc rester visible.

*/


await afficherEchanges();


}



/* =========================================
   SUPPRIMER
========================================= */


async function supprimerEchange(

id,

bloc

) {


const confirmation =

confirm(

"Voulez-vous vraiment supprimer cette demande ?"

);



if(

!confirmation

) {


return;


}




const {

error

}

=

await supabaseClient

.from("echanges")

.delete()

.eq(

"id",

id

);




/* ERREUR */


if(error) {


console.error(error);



alert(

"❌ Erreur lors de la suppression : "

+

error.message

);


return;


}




/*

SUPPRESSION IMMEDIATE DU VISUEL

Cela évite que la carte reste affichée
pendant le rafraîchissement.

*/


if(

bloc

) {


bloc.remove();


}




alert(

"🗑️ La demande a été supprimée."

);




/*

RECHARGEMENT DEPUIS SUPABASE

*/


await afficherEchanges();


}



/* =========================================
   FORMAT DATE
========================================= */


function formatDate(date) {


if(

!date

) {


return "";


}



const morceaux =

date.split("-");



if(

morceaux.length !== 3

) {


return date;


}



return

morceaux[2]

+

"/"

+

morceaux[1]

+

"/"

+

morceaux[0];


}



/* =========================================
   FORMAT HEURE
========================================= */


function formatHeure(heure) {


if(

!heure

) {


return "";


}



return

heure.substring(

0,

5

);


}
