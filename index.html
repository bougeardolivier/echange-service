<!DOCTYPE html>

<html lang="fr">

<head>

<title>ÉCHANGE SERVICE</title>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>


/* =========================================================
   VARIABLES
========================================================= */

:root {

    --bleu-nuit: #102a43;

    --bleu-fonce: #163f63;

    --bleu: #1769aa;

    --bleu-clair: #2d8fd5;

    --cyan: #4bb3e8;

    --gris-fond: #eef2f6;

    --vert: #20a464;

    --orange: #f59e0b;

    --orange-clair: #fff4df;

    --rouge: #dc3545;

    --rouge-clair: #fff0f1;

    --ombre: 0 10px 30px rgba(16,42,67,0.10);

}


/* =========================================================
   RESET
========================================================= */

* {

    box-sizing: border-box;

}


html {

    scroll-behavior: smooth;

}


body {

    margin: 0;

    font-family:

        -apple-system,

        "Segoe UI",

        Roboto,

        Arial,

    background:

        linear-gradient(
            180deg,

}


/* =========================================================
   HEADER
========================================================= */

header {

        linear-gradient(
            135deg,

            var(--bleu-fonce),

}


/* Décoration */

header::before {

    content: "";

    width: 400px;

    height: 400px;

    border-radius: 50%;

    background:

        rgba(255,255,255,0.04);

    left: -150px;

}


header::after {

    content: "";

    position: absolute;

    width: 500px;

    height: 500px;

    border-radius: 50%;

    border:

        2px solid
        rgba(255,255,255,0.06);

    right: -300px;

    top: -220px;

}


.logo-train {

    font-size: 42px;

    display: block;

    margin-bottom: 4px;

    position: relative;

    z-index: 2;

}


header h1 {

    margin: 0;

    font-size: 30px;

    letter-spacing: 1px;

    font-weight: 800;

    position: relative;

    z-index: 2;

}


header p {

    margin:

        8px 0
        0;

    font-size: 16px;

    opacity: 0.88;

    position: relative;

    z-index: 2;

}


/* =========================================================
   LIGNE FERROVIAIRE
========================================================= */

.rail {

    height: 8px;

    background:

        repeating-linear-gradient(

            90deg,

            #b8c4ce 0px,

            #b8c4ce 18px,

            #657787 18px,

            #657787 22px

        );

}


/* =========================================================
   CONTENU
========================================================= */

main {

    max-width: 720px;

    margin:

        -20px auto
        110px;

    padding:

        0 16px;

    position: relative;

    z-index: 5;

}


/* =========================================================
   CARTES
========================================================= */

.card {

    background:

        rgba(255,255,255,0.96);

    border-radius: 22px;

    padding: 22px;

    margin-top: 16px;

    box-shadow:

        var(--ombre);

    border:

        1px solid
        rgba(255,255,255,0.8);

}


.card h2 {

    margin:

        0
        0
        15px;

    font-size: 23px;

}


.card h3 {

    margin-top: 0;

}


/* =========================================================
   CLASSE CACHEE
========================================================= */

.hidden {

    display: none !important;

}


/* =========================================================
   ACCUEIL
========================================================= */

.accueil-icone {

    font-size: 38px;

    margin-bottom: 8px;

}


.intro {

    color: var(--gris);

    line-height: 1.5;

}


/* =========================================================
   CHOIX METIER
========================================================= */

.choice {

    width: 100%;

    padding: 20px;

    margin-top: 14px;

    border-radius: 18px;

    border:

        1px solid
        #dce5ec;

    background:

        linear-gradient(
            135deg,
            white,
            #f5f9fc
        );

    font-size: 20px;

    font-weight: 700;

    text-align: left;

    color: var(--bleu-nuit);

    cursor: pointer;

    transition:

        transform 0.2s,
        box-shadow 0.2s;

    box-shadow:

        0 5px 15px

}


.choice:hover {

    transform:

        translateY(-2px);

    box-shadow:

        0 10px 22px

}


.choice:active {

    transform:

        scale(0.98);

}


.choice small {

    display: block;

    margin-top: 6px;

    font-size: 14px;

    font-weight: 400;

    color: var(--gris);

}


.choice-icon {

    font-size: 30px;

    margin-right: 10px;

}


/* =========================================================
   BADGE METIER
========================================================= */

.badge {

    display: inline-flex;

    align-items: center;

    gap: 6px;

    background:

        linear-gradient(
            135deg,
            var(--bleu),
            var(--bleu-clair)
        );

    color: white;

    padding:

        7px 13px;

    border-radius: 30px;

    font-size: 13px;

    font-weight: 700;

    margin-bottom: 10px;

}


/* =========================================================
   FORMULAIRE
========================================================= */

label {

    display: block;

    font-size: 14px;

    font-weight: 700;

    margin-top: 14px;

    color: #445464;

}


input,

textarea {

    width: 100%;

    padding: 14px;

    margin-top: 6px;

    border-radius: 12px;

    border:

        1px solid
        #d3dde5;

    background: white;

    font-size: 16px;

    color: #1d2a35;

    outline: none;

    transition:

        border 0.2s,
        box-shadow 0.2s;

}


input:focus,

textarea:focus {

    border-color:

        var(--bleu-clair);

    box-shadow:

        0 0 0 3px
        rgba(45,143,213,0.15);

}


textarea {

    min-height: 90px;

    resize: vertical;

}


.row {

    display: grid;

    grid-template-columns:

        1fr 1fr;

    gap: 12px;

}


/* =========================================================
   BOUTONS
========================================================= */

button {

    cursor: pointer;

    font-family: inherit;

}


.btn {

    width: 100%;

    padding: 16px;

    margin-top: 16px;

    border: none;

    border-radius: 14px;

    background:

        linear-gradient(
            135deg,
            var(--bleu),
            var(--bleu-clair)
        );

    color: white;

    font-size: 16px;

    font-weight: 800;

    letter-spacing: 0.3px;

    box-shadow:

        0 6px 15px
        rgba(23,105,170,0.25);

    transition:

        transform 0.15s,
        opacity 0.15s;

}


.btn:hover {

    transform:

        translateY(-1px);

}


.btn:active {

    transform:

        scale(0.98);

}


.btn-secondaire {

    background:

        #e8eef3;

    color:

        var(--bleu-nuit);

    box-shadow: none;

}


.btn-interesse {

    background:

        linear-gradient(
            135deg,
            #e58b00,
            var(--orange)
        );

    box-shadow:

        0 6px 15px
        rgba(245,158,11,0.25);

}


.btn-supprimer {

    background:

        linear-gradient(
            135deg,
            #c72d3d,
            var(--rouge)
        );

    box-shadow:

        0 6px 15px
        rgba(220,53,69,0.22);

}


/* =========================================================
   LISTE DES ECHANGES
========================================================= */

.titre-metier {

    margin:

        0
        0
        18px;

    font-size: 17px;

    color: var(--gris);

}


.item {

    position: relative;

    overflow: hidden;

    background:

        linear-gradient(
            135deg,
            white,
            #f7fafc
        );

    border-radius: 18px;

    padding: 18px;

    margin-top: 14px;

    border:

        1px solid
        #e1e8ee;

    border-left:

        6px solid
        var(--bleu);

    box-shadow:

        0 5px 16px
        rgba(16,42,67,0.06);

}


/* décoration */

.item::after {

    content: "🚆";

    position: absolute;

    right: 16px;

    top: 15px;

    font-size: 22px;

    opacity: 0.08;

}


.nom-agent {

    font-size: 18px;

    font-weight: 800;

    color: var(--bleu-nuit);

    margin-bottom: 10px;

}


.info {

    margin-top: 5px;

    font-size: 15px;

    color: #455563;

}


.info strong {

    color: #263747;

}


/* =========================================================
   STATUT
========================================================= */

.statut {

    display: inline-block;

    margin-top: 12px;

    padding:

        6px 11px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: 800;

}


.statut-disponible {

    background:

        var(--vert-clair);

    color:

        var(--vert);

}


.statut-interesse {

    background:

        var(--orange-clair);

    color:

        #b36b00;

}


/* =========================================================
   AGENT INTERESSE
========================================================= */

.interesse-box {

    margin-top: 14px;

    padding: 13px;

    border-radius: 12px;

    background:

        linear-gradient(
            135deg,
            #fff7e8,
            #fffdf8
        );

    border:

        1px solid
        #f4d9a5;

}


.interesse-titre {

    font-size: 13px;

    font-weight: 700;

    color: #9a5c00;

}


.interesse-nom {

    margin-top: 5px;

    font-weight: 800;

    color: #5d3a00;

}


/* =========================================================
   COMMENTAIRE
========================================================= */

.commentaire {

    margin-top: 12px;

    padding-top: 12px;

    border-top:

        1px solid
        #e7edf2;

    color:

        var(--gris);

    font-size: 14px;

}


/* =========================================================
   ACTIONS DANS UNE CARTE
========================================================= */

.actions {

    margin-top: 15px;

    display: grid;

    gap: 8px;

}


.actions button {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 11px;

    font-size: 14px;

    font-weight: 700;

}


/* =========================================================
   MESSAGE VIDE
========================================================= */

.vide {

    text-align: center;

    padding:

        30px
        15px;

    color:

        var(--gris);

}


.vide .icone {

    font-size: 40px;

    margin-bottom: 10px;

}


/* =========================================================
   NAVIGATION
========================================================= */

nav {

    position: fixed;

    z-index: 100;

    bottom: 0;

    left: 0;

    right: 0;

    background:

        rgba(255,255,255,0.96);

    backdrop-filter:

        blur(15px);

    border-top:

        1px solid
        #dfe6ec;

    padding:

        8px
        8px
        calc(8px + env(safe-area-inset-bottom));

    display: flex;

    justify-content: space-around;

    box-shadow:

        0 -5px 20px
        rgba(0,0,0,0.06);

}


nav button {

    flex: 1;

    border: none;

    background: none;

    color:

        #516170;

    font-size: 12px;

    padding: 9px 4px;

    border-radius: 10px;

}


nav button span {

    display: block;

    font-size: 20px;

    margin-bottom: 3px;

}


nav button:hover {

    background:

        #eef5fa;

    color:

        var(--bleu);

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 500px) {

    header h1 {

        font-size: 25px;

    }


    main {

        padding:

            0 10px;

    }


    .card {

        padding: 18px;

        border-radius: 18px;

    }


    .row {

        grid-template-columns:

        gap: 0;

    }

}


</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <span class="logo-train">
        🚆
    </span>

    <h1>
        ÉCHANGE SERVICE
    </h1>

    <p>
        Échange de journées entre agents
    </p>

</header>


<div class="rail"></div>



<!-- =====================================================
     CONTENU
===================================================== -->

<main>


<!-- =====================================================
     ACCUEIL
===================================================== -->

<section id="accueil">


    <div class="card">


        <div class="accueil-icone">

            👋

        </div>


        <h2>

            Bienvenue

        </h2>


        <p class="intro">

            Cette application permet aux agents de proposer
            une journée de service et de consulter les
            journées disponibles pour un éventuel échange.

        </p>


        <p class="intro">

            Choisissez votre métier pour commencer.

        </p>


    </div>



    <!-- ADC -->

    <button
        class="choice"
        onclick="choisirMetier('ADC')"
    >

        <span class="choice-icon">

            🚆

        </span>

        ADC


        <small>

            Conducteurs de train

        </small>


    </button>



    <!-- ASCT -->

    <button
        class="choice"
        onclick="choisirMetier('ASCT')"
    >

        <span class="choice-icon">

            🧑‍✈️

        </span>

        ASCT


        <small>

            Agents du Service Commercial Train

        </small>


    </button>


</section>



<!-- =====================================================
     PROPOSER UNE JOURNEE
===================================================== -->

<section
    id="proposer"
    class="hidden"
>


    <div class="card">


        <div
            id="metier"
            class="badge"
        >

        </div>


        <h2>

            ➕ Ma journée à échanger

        </h2>


        <!-- NOM -->


        <label>

            👤 Nom et prénom

        </label>


        <input

            id="nom"

            placeholder="Exemple : Jean DUPONT"

        >



        <!-- DATE -->


        <label>

            📅 Date de la journée

        </label>


        <input

            id="date"

            type="date"

        >



        <!-- HORAIRES -->


        <div class="row">


            <div>


                <label>

                    🚉 Prise de service

                </label>


                <input

                    id="prise"

                    type="time"

                >


            </div>



            <div>


                <label>

                    🏁 Fin de service

                </label>


                <input

                    id="fin"

                    type="time"

                >


            </div>


        </div>



        <!-- COMMENTAIRE -->


        <label>

            💬 Commentaire facultatif

        </label>


        <textarea

            id="commentaire"

            placeholder="Exemple : TER, réserve, numéro de train..."

        ></textarea>



        <!-- BOUTON PUBLIER -->


        <button

            class="btn"

            onclick="publier()"

        >

            🚆 PUBLIER MA JOURNÉE

        </button>



        <button

            class="btn btn-secondaire"

            onclick="afficher('echanges')"

        >

            🔎 VOIR LES ÉCHANGES

        </button>


    </div>


</section>



<!-- =====================================================
     ECHANGES
===================================================== -->

<section
    id="echanges"
    class="hidden"
>


    <div class="card">


        <h2>

            🔎 Échanges disponibles

        </h2>


        <p
            class="titre-metier"
            id="metierListe"
        >

        </p>


        <div
            id="listeEchanges"
        >

        </div>



        <button

            class="btn"

            onclick="afficher('proposer')"

        >

            ➕ PROPOSER UNE JOURNÉE

        </button>



        <button

            class="btn btn-secondaire"

            onclick="chargerEchanges()"

        >

            🔄 ACTUALISER

        </button>


    </div>


</section>


</main>



<!-- =====================================================
     MENU BAS
===================================================== -->

<nav
    id="menu"
    class="hidden"
>


    <button
        onclick="afficher('proposer')"
    >

        <span>➕</span>

        Ma journée

    </button>



    <button
        onclick="afficher('echanges')"
    >

        <span>🔎</span>

        Échanges

    </button>



    <button
        onclick="changerMetier()"
    >

        <span>🚆</span>

        Métier

    </button>


</nav>




<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


/* =========================================================
   CONFIGURATION SUPABASE
========================================================= */


const SUPABASE_URL =

    "https://nptwpoguokbjuzdyxach.supabase.co";


/*

IMPORTANT :

Remplace la valeur ci-dessous par ta Publishable Key
Supabase.

*/

const SUPABASE_KEY =

    "sb_publishable_VxIiVyjGPVxipQx8j5njxA_YxaFOnAF";



const supabaseClient =

    supabase.createClient(

        SUPABASE_URL,

        SUPABASE_KEY

    );




/* =========================================================
   VARIABLES
========================================================= */


let metierActuel = "";



/* =========================================================
   AFFICHER UNE PAGE
========================================================= */


function afficher(page) {


    document

        .querySelectorAll(
            "main section"
        )

        .forEach(

            section => {

                section.classList.add(
                    "hidden"
                );

            }

        );



    document

        .getElementById(page)

        .classList.remove(
            "hidden"
        );



    if (

        page === "echanges"

    ) {

        chargerEchanges();

    }


}




/* =========================================================
   CHOISIR UN METIER
========================================================= */


function choisirMetier(metier) {


    metierActuel = metier;



    let nomMetier = "";


    if (

        metier === "ADC"

    ) {

        nomMetier =

            "🚆 ADC";

    }


    if (

        metier === "ASCT"

    ) {

        nomMetier =

            "🧑‍✈️ ASCT";

    }



    document

        .getElementById("metier")

        .innerText =

            nomMetier;



    document

        .getElementById("metierListe")

        .innerHTML =

            "Métier : <strong>" +

            metier +

            "</strong>";



    document

        .getElementById("menu")

        .classList.remove(
            "hidden"
        );



    afficher(
        "proposer"
    );


}




/* =========================================================
   CHANGER DE METIER
========================================================= */


function changerMetier() {


    metierActuel = "";



    document

        .getElementById("menu")

        .classList.add(
            "hidden"
        );



    afficher(
        "accueil"
    );


}




/* =========================================================
   PUBLIER UNE JOURNEE
========================================================= */


async function publier() {


    let nom =

        document

            .getElementById("nom")

            .value

            .trim();



    let date =

        document

            .getElementById("date")

            .value;



    let prise =

        document

            .getElementById("prise")

            .value;



    let fin =

        document

            .getElementById("fin")

            .value;



    let commentaire =

        document

            .getElementById("commentaire")

            .value

            .trim();



    /* VERIFICATION */


    if (

        !nom ||

        !date ||

        !prise ||

        !fin

    ) {


        alert(

            "⚠️ Merci de remplir le nom, la date et les horaires."

        );


        return;

    }



    /* ENVOI VERS SUPABASE */


    const {

        error

    }

    =

    await supabaseClient

        .from("echanges")

        .insert([

            {

                metier:

                    metierActuel,


                nom:

                    nom,


                date_service:

                    date,


                prise_service:

                    prise,


                fin_service:

                    fin,


                commentaire:

                    commentaire,


                statut:

                    "disponible",


                agent_interesse:

                    null

            }

        ]);




    /* ERREUR */


    if (

        error

    ) {


        console.error(
            error
        );


        alert(

            "❌ Erreur lors de la publication : " +

            error.message

        );


        return;

    }



    /* VIDAGE DU FORMULAIRE */


    document

        .getElementById("nom")

        .value = "";



    document

        .getElementById("date")

        .value = "";



    document

        .getElementById("prise")

        .value = "";



    document

        .getElementById("fin")

        .value = "";



    document

        .getElementById("commentaire")

        .value = "";



    alert(

        "✅ Votre journée est publiée !"

    );



    afficher(
        "echanges"
    );


}




/* =========================================================
   CHARGER LES ECHANGES
========================================================= */


async function chargerEchanges() {


    let zone =

        document.getElementById(
            "listeEchanges"
        );



    zone.innerHTML =

        `

        <div class="vide">

            <div class="icone">

                🚆

            </div>

            Chargement des échanges...

        </div>

        `;



    const {

        data,

        error

    }

    =

    await supabaseClient

        .from("echanges")

        .select("*")

        .eq(

            "metier",

            metierActuel

        )

        .order(

            "id",

            {

                ascending:

                    false

            }

        );




    /* ERREUR */


    if (

        error

    ) {


        console.error(
            error
        );


        zone.innerHTML =

            `

            <div class="vide">

                <div class="icone">

                    ❌

                </div>

                <strong>

                    Erreur lors du chargement

                </strong>

                <br><br>

                ${error.message}

            </div>

            `;


        return;

    }




    /* NETTOYAGE */


    zone.innerHTML = "";




    /* AUCUNE DEMANDE */


    if (

        !data ||

        data.length === 0

    ) {


        zone.innerHTML =

            `

            <div class="vide">

                <div class="icone">

                    🚉

                </div>

                <strong>

                    Aucune journée proposée

                </strong>

                <br><br>

                Soyez le premier à proposer
                une journée !

            </div>

            `;


        return;

    }




    /* AFFICHAGE */


    data.forEach(

        echange => {


            afficherCarte(
                echange,
                zone
            );


        }

    );


}




/* =========================================================
   AFFICHER UNE CARTE D'ECHANGE
========================================================= */


function afficherCarte(

    echange,

    zone

) {


    let bloc =

        document.createElement(
            "div"
        );



    bloc.className =

        "item";



    /* DATE FRANCAISE */


    let dateAffichee =

        echange.date_service;



    if (

        echange.date_service

    ) {


        let morceaux =

            echange

                .date_service

                .split("-");



        if (

            morceaux.length === 3

        ) {


            dateAffichee =

                morceaux[2]

                + "/"

                + morceaux[1]

                + "/"

                + morceaux[0];

        }

    }




    /* HORAIRES */


    let prise =

        echange.prise_service

        ?

        echange

            .prise_service

            .substring(0,5)

        :

        "";



    let fin =

        echange.fin_service

        ?

        echange

            .fin_service

            .substring(0,5)

        :

        "";




    /* STATUT */


    let statutHTML = "";



    if (

        echange.agent_interesse

        &&

        echange.agent_interesse

        .trim() !== ""

    ) {


        statutHTML =

            `

            <div class="statut statut-interesse">

                🤝 Agent intéressé

            </div>

            `;


    }


    else {


        statutHTML =

            `

            <div class="statut statut-disponible">

                ● Disponible

            </div>

            `;

    }




    /* AGENT INTERESSE */


    let interesseHTML = "";



    if (

        echange.agent_interesse

        &&

        echange.agent_interesse

        .trim() !== ""

    ) {


        interesseHTML =

            `

            <div class="interesse-box">

                <div class="interesse-titre">

                    🤝 AGENT INTÉRESSÉ

                </div>

                <div class="interesse-nom">

                    ${securiserTexte(

                        echange.agent_interesse

                    )}

                </div>

            </div>

            `;

    }




    /* BOUTON INTERESSE */


    let boutonInteresse = "";



    if (

        !

        echange.agent_interesse

        ||

        echange.agent_interesse

        .trim() === ""

    ) {


        boutonInteresse =

            `

            <button

                class="btn-interesse"

                onclick="jeSuisInteresse(

                    ${echange.id}

                )"

            >

                🤝 JE SUIS INTÉRESSÉ

            </button>

            `;

    }




    /* CONTENU */


    bloc.innerHTML =

        `

        <div class="nom-agent">

            👤

            ${securiserTexte(
                echange.nom
            )}

        </div>



        <div class="info">

            📅

            <strong>

                ${dateAffichee}

            </strong>

        </div>



        <div class="info">

            ⏰

            <strong>

                ${prise}

                →

                ${fin}

            </strong>

        </div>



        ${

            echange.commentaire

            ?

            `

            <div class="commentaire">

                💬

                ${securiserTexte(

                    echange.commentaire

                )}

            </div>

            `

            :

            ""

        }



        ${statutHTML}



        ${interesseHTML}



        <div class="actions">


            ${boutonInteresse}



            <button

                class="btn-supprimer"

                onclick="supprimerEchange(

                    ${echange.id}

                )"

            >

                🗑️ SUPPRIMER

            </button>


        </div>

        `;



    zone.appendChild(
        bloc
    );


}




/* =========================================================
   JE SUIS INTERESSE
========================================================= */


async function jeSuisInteresse(id) {


    let nomInteresse =

        prompt(

            "👤 Indiquez votre nom et prénom :"

        );



    /* ANNULATION */


    if (

        nomInteresse === null

    ) {


        return;

    }



    nomInteresse =

        nomInteresse.trim();



    if (

        nomInteresse === ""

    ) {


        alert(

            "⚠️ Merci d'indiquer votre nom."

        );


        return;

    }




    /* MISE A JOUR */


    const {

        error

    }

    =

    await supabaseClient

        .from("echanges")

        .update(

            {

                agent_interesse:

                    nomInteresse,


                statut:

                    "interesse"

            }

        )

        .eq(

            "id",

            id

        );




    /* ERREUR */


    if (

        error

    ) {


        console.error(
            error
        );


        alert(

            "❌ Erreur : " +

            error.message

        );


        return;

    }



    alert(

        "🤝 Votre intérêt a été enregistré !"

    );



    /* IMPORTANT :

       LA DEMANDE RESTE VISIBLE

       On recharge simplement la liste.

    */


    await chargerEchanges();


}




/* =========================================================
   SUPPRIMER UNE DEMANDE
========================================================= */


async function supprimerEchange(id) {


    let confirmation =

        confirm(

            "🗑️ Voulez-vous vraiment supprimer cette demande ?"

        );



    if (

        !confirmation

    ) {


        return;

    }




    /* SUPPRESSION SUPABASE */


    const {

        error

    }

    =

    await supabaseClient

        .from("echanges")

        .delete()

        .eq(

            "id",

            id

        );




    /* ERREUR */


    if (

        error

    ) {


        console.error(
            error
        );


        alert(

            "❌ Impossible de supprimer la demande : "

            +

            error.message

        );


        return;

    }



    alert(

        "✅ La demande a été supprimée."

    );



    /* RECHARGEMENT COMPLET */


    await chargerEchanges();


}




/* =========================================================
   SECURISER LE TEXTE
========================================================= */


function securiserTexte(texte) {


    if (

        texte === null

        ||

        texte === undefined

    ) {


        return "";

    }



    let div =

        document.createElement(
            "div"
        );



    div.innerText = texte;



    return div.innerHTML;


}

   INITIALISATION
========================================================= */


/*
