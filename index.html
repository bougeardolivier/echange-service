<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>ÉCHANGE SERVICE</title>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>


:root {

    --bleu-fonce: #102a43;
    --bleu: #1769aa;
    --gris: #f3f6f8;
    --blanc: #ffffff;

}


* {

    box-sizing: border-box;

}


body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: var(--gris);

    color: #17212b;

}


/* =========================
   HEADER
========================= */


header {

    background:

        linear-gradient(
            135deg,
            var(--bleu-fonce),
            var(--bleu)
        );

    color: white;

    padding: 25px 20px 35px;

    text-align: center;

}


header h1 {

    margin: 0;

    font-size: 28px;

}


header p {

    margin-bottom: 0;

    opacity: 0.9;

}


/* =========================
   CONTENU
========================= */


main {

    max-width: 650px;

    margin: -15px auto 90px;

    padding: 0 15px;

}


.card {

    background: white;

    border-radius: 18px;

    padding: 20px;

    margin-top: 15px;

    box-shadow:

        0 5px 20px
        rgba(0,0,0,0.08);

}


.hidden {

    display: none;

}


/* =========================
   CHOIX METIER
========================= */


.choice {

    width: 100%;

    padding: 22px;

    margin-top: 15px;

    border-radius: 16px;

    border:

        1px solid
        #e0e6eb;

    background: white;

    font-size: 19px;

    font-weight: bold;

    text-align: left;

}


.choice small {

    display: block;

    margin-top: 5px;

    font-size: 14px;

    font-weight: normal;

    color: #687887;

}


/* =========================
   BOUTONS
========================= */


button {

    cursor: pointer;

}


.btn {

    width: 100%;

    padding: 15px;

    margin-top: 10px;

    border: none;

    border-radius: 12px;

    background: var(--bleu);

    color: white;

    font-size: 16px;

    font-weight: bold;

}


.btn-secondaire {

    background: #e8eef4;

    color: #17212b;

}


.btn-interesse {

    background: #167242;

}


/* =========================
   FORMULAIRES
========================= */


label {

    display: block;

    font-size: 14px;

    font-weight: bold;

    margin-top: 10px;

    color: #526273;

}


input,

textarea {

    width: 100%;

    padding: 13px;

    margin-top: 5px;

    border-radius: 10px;

    border:

        1px solid
        #ccd6df;

    font-size: 16px;

}


textarea {

    min-height: 80px;

    resize: vertical;

}


.row {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

}


/* =========================
   ECHANGES
========================= */


.item {

    background: #f8fafc;

    border-left:

        5px solid
        var(--bleu);

    padding: 15px;

    margin-top: 12px;

    border-radius: 8px;

}


.badge {

    display: inline-block;

    background: #e7f5ec;

    color: #167242;

    padding: 6px 10px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

}


/* =========================
   MENU BAS
========================= */


nav {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    background: white;

    border-top:

        1px solid
        #dfe6ec;

    padding: 8px;

    display: flex;

    justify-content:
        space-around;

}


nav button {

    border: none;

    background: none;

    font-size: 12px;

    padding: 8px;

    color: #1769aa;

}


</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->


<header>

<h1>
🚆 ÉCHANGE SERVICE
</h1>


<p>
Échange de journées entre agents
</p>


</header>



<main>


<!-- =========================
     ACCUEIL
========================= -->


<section id="accueil">


<div class="card">


<h2>
Bienvenue 👋
</h2>


<p>
Choisissez votre métier pour commencer.
</p>


</div>



<button
class="choice"
onclick="choisirMetier('ADC')"
>

🚆 ADC

<small>
Conducteurs de train
</small>

</button>



<button
class="choice"
onclick="choisirMetier('ASCT')"
>

👤 ASCT

<small>
Agents du Service Commercial Train
</small>

</button>


</section>



<!-- =========================
     PROPOSER UNE JOURNEE
========================= -->


<section
id="proposer"
class="hidden"
>


<div class="card">


<span
id="metier"
class="badge"
></span>



<h2>
➕ Ma journée à échanger
</h2>



<label>
Nom et prénom
</label>


<input

id="nom"

placeholder="Exemple : Jean DUPONT"

>



<label>
Date de la journée
</label>


<input

id="date"

type="date"

>



<div class="row">


<div>


<label>
Prise de service
</label>


<input

id="prise"

type="time"

>


</div>



<div>


<label>
Fin de service
</label>


<input

id="fin"

type="time"

>


</div>


</div>



<label>
Commentaire facultatif
</label>


<textarea

id="commentaire"

placeholder="Exemple : TER, réserve..."

></textarea>



<button

class="btn"

onclick="publier()"

>

🚆 PUBLIER MA JOURNÉE

</button>



<button

class="btn btn-secondaire"

onclick="afficher('echanges')"

>

🔎 VOIR LES ÉCHANGES

</button>


</div>


</section>



<!-- =========================
     ECHANGES
========================= -->


<section

id="echanges"

class="hidden"

>


<div class="card">


<h2>
🔎 Échanges disponibles
</h2>



<p>

Métier :

<strong
id="metierEchanges"
></strong>

</p>



<div

id="listeEchanges"

>

</div>



<button

class="btn btn-secondaire"

onclick="afficher('proposer')"

>

➕ PROPOSER UNE JOURNÉE

</button>


</div>


</section>


</main>



<!-- =========================
     MENU
========================= -->


<nav

id="menu"

class="hidden"

>


<button

onclick="afficher('proposer')"

>

➕<br>

Ma journée

</button>



<button

onclick="afficher('echanges')"

>

🔎<br>

Échanges

</button>



<button

onclick="changerMetier()"

>

🚆<br>

Métier

</button>


</nav>



<!-- =========================
     JAVASCRIPT
========================= -->


<script>


/* =========================
   CONNEXION SUPABASE
========================= */


const SUPABASE_URL =

"https://nptwpoguokbjuzdyxach.supabase.co";


const SUPABASE_KEY =

"sb_publishable_VxIiVyjGPVxipQx8j5njxA_YxaFOnAF";



const supabaseClient =

supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY

);



/* =========================
   METIER ACTUEL
========================= */


let metierActuel = "";


/* =========================
   AFFICHER UNE PAGE
========================= */


function afficher(page) {


    document

        .querySelectorAll(
            "main section"
        )

        .forEach(

            section => {

                section
                    .classList
                    .add("hidden");

            }

        );


    document

        .getElementById(page)

        .classList

        .remove("hidden");



    if (

        page === "echanges"

    ) {


        afficherEchanges();


    }


}



/* =========================
   CHOISIR UN METIER
========================= */


function choisirMetier(metier) {


    metierActuel = metier;



    document

        .getElementById("metier")

        .innerText =

        metier;



    document

        .getElementById(
            "metierEchanges"
        )

        .innerText =

        metier;



    document

        .getElementById("menu")

        .classList

        .remove("hidden");



    afficher("proposer");


}



/* =========================
   CHANGER DE METIER
========================= */


function changerMetier() {


    metierActuel = "";



    document

        .getElementById("menu")

        .classList

        .add("hidden");



    afficher("accueil");


}



/* =========================
   PUBLIER UNE JOURNEE
========================= */


async function publier() {


    let nom =

        document

            .getElementById("nom")

            .value

            .trim();



    let date =

        document

            .getElementById("date")

            .value;



    let prise =

        document

            .getElementById("prise")

            .value;



    let fin =

        document

            .getElementById("fin")

            .value;



    let commentaire =

        document

            .getElementById("commentaire")

            .value

            .trim();



    /* VERIFICATION */


    if (

        !nom

        ||

        !date

        ||

        !prise

        ||

        !fin

    ) {


        alert(

            "Merci de remplir le nom, la date et les horaires."

        );


        return;


    }



    /* ENVOI VERS SUPABASE */


    const {

        error

    } =

    await supabaseClient

        .from("echanges")

        .insert(

            [

                {

                    metier:

                        metierActuel,


                    nom:

                        nom,


                    date_service:

                        date,


                    prise_service:

                        prise,


                    fin_service:

                        fin,


                    commentaire:

                        commentaire,


                    statut:

                        "disponible",


                    agent_interesse:

                        null

                }

            ]

        );



    /* ERREUR */


    if (

        error

    ) {


        console.error(error);



        alert(

            "Erreur : " +

            error.message

        );


        return;


    }



    /* NETTOYAGE FORMULAIRE */


    document

        .getElementById("nom")

        .value = "";



    document

        .getElementById("date")

        .value = "";



    document

        .getElementById("prise")

        .value = "";



    document

        .getElementById("fin")

        .value = "";



    document

        .getElementById("commentaire")

        .value = "";



    /* MESSAGE */


    alert(

        "Votre journée est publiée !"

    );



    /* AFFICHER LES ECHANGES */


    afficher("echanges");


}



/* =========================
   AFFICHER LES ECHANGES
========================= */


async function afficherEchanges() {


    let zone =

        document

            .getElementById(
                "listeEchanges"
            );



    document

        .getElementById(
            "metierEchanges"
        )

        .innerText =

        metierActuel;



    /* MESSAGE CHARGEMENT */


    zone.innerHTML =

        "<p>Chargement...</p>";



    /* RECUPERATION SUPABASE */


    const {

        data,

        error

    } =

    await supabaseClient

        .from("echanges")

        .select("*")

        .eq(

            "metier",

            metierActuel

        )

        .eq(

            "statut",

            "disponible"

        )

        .order(

            "date_service",

            {

                ascending: true

            }

        );



    /* ERREUR */


    if (

        error

    ) {


        console.error(error);



        zone.innerHTML =

            "<p>❌ Erreur lors du chargement : "

            +

            error.message

            +

            "</p>";


        return;


    }



    /* NETTOYAGE */


    zone.innerHTML = "";



    /* AUCUN ECHANGE */


    if (

        !data

        ||

        data.length === 0

    ) {


        zone.innerHTML =

            "<p>Aucune journée proposée pour le moment.</p>";


        return;


    }



    /* AFFICHAGE */


    data.forEach(

        echange => {


            let bloc =

                document

                    .createElement("div");



            bloc.className =

                "item";



            let commentaire =

                echange.commentaire

                ||

                "";



            bloc.innerHTML =

                "<strong>"

                +

                echange.nom

                +

                "</strong>"


                +

                "<br>"


                +

                "📅 "

                +

                echange.date_service


                +

                "<br>"


                +

                "⏰ "

                +

                echange.prise_service


                +

                " → "


                +

                echange.fin_service


                +

                "<br>"


                +

                "<small>"

                +

                commentaire


                +

                "</small>"


                +

                "<button "

                +

                'class="btn btn-interesse" '

                +

                'onclick="jeSuisInteresse('

                +

                echange.id

                +

                ')">'

                +

                "🤝 JE SUIS INTÉRESSÉ"

                +

                "</button>";



            zone

                .appendChild(bloc);


        }

    );


}



/* =========================
   JE SUIS INTERESSE
========================= */


async function jeSuisInteresse(id) {


    let nomAgent =

        prompt(

            "Indique ton nom et prénom :"

        );



    /* ANNULATION */


    if (

        !nomAgent

    ) {


        return;


    }



    nomAgent =

        nomAgent.trim();



    if (

        nomAgent === ""

    ) {


        return;


    }



    /* MISE A JOUR SUPABASE */


    const {

        error

    } =

    await supabaseClient

        .from("echanges")

        .update(

            {

                statut:

                    "interesse",


                agent_interesse:

                    nomAgent

            }

        )

        .eq(

            "id",

            id

        );



    /* ERREUR */


    if (

        error

    ) {


        console.error(error);



        alert(

            "Erreur : "

            +

            error.message

        );


        return;


    }



    /* CONFIRMATION */


    alert(

        "Votre intérêt a été enregistré !"

    );



    /* ACTUALISATION */


    afficherEchanges();


}


</script>


</body>


</html>
