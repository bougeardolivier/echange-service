<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ÉCHANGE SERVICE</title>

<style>

:root {
    --bleu-fonce: #102a43;
    --bleu: #1769aa;
    --gris: #f3f6f8;
    --vert: #167242;
    --orange: #c96f00;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--gris);
    color: #17212b;
}

header {
    background: linear-gradient(135deg, var(--bleu-fonce), var(--bleu));
    color: white;
    padding: 25px 20px 35px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin-bottom: 0;
    opacity: 0.9;
}

main {
    max-width: 650px;
    margin: -15px auto 90px;
    padding: 0 15px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-top: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.hidden {
    display: none;
}

.choice {
    width: 100%;
    padding: 22px;
    margin-top: 15px;
    border-radius: 16px;
    border: 1px solid #e0e6eb;
    background: white;
    font-size: 19px;
    font-weight: bold;
    text-align: left;
}

.choice small {
    display: block;
    margin-top: 5px;
    font-size: 14px;
    font-weight: normal;
    color: #687887;
}

button {
    cursor: pointer;
}

.btn {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    background: var(--bleu);
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.btn-interesse {
    background: var(--vert);
}

.btn-secondaire {
    background: #e8eef4;
    color: #17212b;
}

label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-top: 10px;
    color: #526273;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    margin-top: 5px;
    border-radius: 10px;
    border: 1px solid #ccd6df;
    font-size: 16px;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.item {
    background: #f8fafc;
    border-left: 5px solid var(--bleu);
    padding: 15px;
    margin-top: 12px;
    border-radius: 8px;
}

.badge {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.badge-disponible {
    background: #e7f5ec;
    color: var(--vert);
}

.badge-encours {
    background: #fff0d8;
    color: var(--orange);
}

nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 1px solid #dfe6ec;
    padding: 8px;
    display: flex;
    justify-content: space-around;
}

nav button {
    border: none;
    background: none;
    font-size: 12px;
    padding: 8px;
}

</style>

</head>


<body>


<header>

<h1>🚆 ÉCHANGE SERVICE</h1>

<p>Échange de journées entre agents</p>

</header>



<main>


<!-- ACCUEIL -->

<section id="accueil">

<div class="card">

<h2>Bienvenue 👋</h2>

<p>Choisissez votre métier pour commencer.</p>

</div>


<button class="choice" onclick="choisirMetier('ADC')">

🚆 ADC

<small>Conducteurs de train</small>

</button>


<button class="choice" onclick="choisirMetier('ASCT')">

👤 ASCT

<small>Agents du Service Commercial Train</small>

</button>


</section>



<!-- PROPOSER UNE JOURNÉE -->

<section id="proposer" class="hidden">

<div class="card">

<span id="metier" class="badge badge-disponible"></span>

<h2>➕ Ma journée à échanger</h2>


<label>Nom et prénom</label>

<input
id="nom"
placeholder="Exemple : Jean DUPONT"
>


<label>Date de la journée</label>

<input
id="date"
type="date"
>


<div class="row">

<div>

<label>Prise de service</label>

<input
id="prise"
type="time"
>

</div>


<div>

<label>Fin de service</label>

<input
id="fin"
type="time"
>

</div>

</div>


<label>Commentaire facultatif</label>

<textarea
id="commentaire"
placeholder="Exemple : TER, réserve..."
></textarea>


<button
class="btn"
onclick="publier()"
>

🚆 PUBLIER MA JOURNÉE

</button>


<button
class="btn btn-secondaire"
onclick="afficher('echanges')"
>

🔎 VOIR LES ÉCHANGES

</button>


</div>

</section>



<!-- ÉCHANGES -->

<section id="echanges" class="hidden">

<div class="card">

<h2>🔎 Échanges disponibles</h2>

<div id="listeEchanges"></div>


<button
class="btn btn-secondaire"
onclick="afficher('proposer')"
>

➕ PROPOSER UNE JOURNÉE

</button>


</div>

</section>


</main>



<nav id="menu" class="hidden">

<button onclick="afficher('proposer')">

➕ Ma journée

</button>


<button onclick="afficher('echanges')">

🔎 Échanges

</button>


<button onclick="changerMetier()">

🚆 Métier

</button>


</nav>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================
   CONFIGURATION SUPABASE
========================= */

const SUPABASE_URL =
"https://nptwpoguokbjuzdyxach.supabase.co";


const SUPABASE_KEY =
"sb_publishable_VxIiVyjGPVxipQx8j5njxA_YxaFOnAF";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



/* =========================
   MÉTIER ACTUEL
========================= */

let metierActuel = "";



/* =========================
   NAVIGATION
========================= */

function afficher(page) {


    document
    .querySelectorAll("main section")
    .forEach(section => {

        section.classList.add("hidden");

    });


    document
    .getElementById(page)
    .classList.remove("hidden");


    if (page === "echanges") {

        afficherEchanges();

    }

}



/* =========================
   CHOISIR MÉTIER
========================= */

function choisirMetier(metier) {


    metierActuel = metier;


    document
    .getElementById("metier")
    .innerText = metier;


    document
    .getElementById("menu")
    .classList.remove("hidden");


    afficher("proposer");

}



/* =========================
   CHANGER MÉTIER
========================= */

function changerMetier() {


    metierActuel = "";


    document
    .getElementById("menu")
    .classList.add("hidden");


    afficher("accueil");

}



/* =========================
   PUBLIER UNE JOURNÉE
========================= */

async function publier() {


    let nom =
    document
    .getElementById("nom")
    .value
    .trim();


    let date =
    document
    .getElementById("date")
    .value;


    let prise =
    document
    .getElementById("prise")
    .value;


    let fin =
    document
    .getElementById("fin")
    .value;


    let commentaire =
    document
    .getElementById("commentaire")
    .value
    .trim();



    if (

        !nom ||
        !date ||
        !prise ||
        !fin

    ) {


        alert(
        "Merci de remplir le nom, la date et les horaires."
        );


        return;

    }



    const { error } =

    await supabaseClient

    .from("echanges")

    .insert([

        {

            metier: metierActuel,

            nom: nom,

            date_service: date,

            prise_service: prise,

            fin_service: fin,

            commentaire: commentaire,

            statut: "disponible",

            agent_interesse: null

        }

    ]);



    if (error) {


        console.error(error);


        alert(
        "Erreur lors de la publication : "
        +
        error.message
        );


        return;

    }



    document
    .getElementById("nom")
    .value = "";


    document
    .getElementById("date")
    .value = "";


    document
    .getElementById("prise")
    .value = "";


    document
    .getElementById("fin")
    .value = "";


    document
    .getElementById("commentaire")
    .value = "";



    alert(
    "Votre journée est publiée !"
    );


    afficher("echanges");

}



/* =========================
   AGENT INTÉRESSÉ
========================= */

async function interesser(id, nomProposant) {


    let nomAgent = prompt(

        "Entrez votre nom et prénom :"

    );



    if (

        !nomAgent ||
        nomAgent.trim() === ""

    ) {


        return;

    }



    nomAgent = nomAgent.trim();



    if (

        nomAgent.toLowerCase()
        ===
        nomProposant.toLowerCase()

    ) {


        alert(
        "Vous ne pouvez pas répondre à votre propre proposition."
        );


        return;

    }



    const { error } =

    await supabaseClient

    .from("echanges")

    .update({

        agent_interesse: nomAgent,

        statut: "en_cours"

    })

    .eq("id", id);



    if (error) {


        console.error(error);


        alert(
        "Erreur : "
        +
        error.message
        );


        return;

    }



    alert(

        "Votre intérêt pour cet échange a été enregistré !"

    );


    afficherEchanges();

}



/* =========================
   AFFICHER LES ÉCHANGES
========================= */

async function afficherEchanges() {


    let zone =

    document.getElementById(
        "listeEchanges"
    );


    zone.innerHTML =
    "<p>Chargement...</p>";



    const { data, error } =

    await supabaseClient

    .from("echanges")

    .select("*")

    .eq(
        "metier",
        metierActuel
    )

    .order(
        "date_service",
        {
            ascending: true
        }
    );



    if (error) {


        console.error(error);


        zone.innerHTML =

        "<p>Erreur lors du chargement : "

        +

        error.message

        +

        "</p>";


        return;

    }



    zone.innerHTML = "";



    if (

        !data ||
        data.length === 0

    ) {


        zone.innerHTML =

        "<p>Aucune journée proposée pour le moment.</p>";


        return;

    }



    data.forEach(echange => {


        let bloc =

        document.createElement("div");


        bloc.className = "item";



        let statutHTML = "";


        if (

            echange.statut === "disponible"

        ) {


            statutHTML =

            '<span class="badge badge-disponible">🟢 Disponible</span>';


        }

        else {


            statutHTML =

            '<span class="badge badge-encours">🟠 Échange en cours</span>';

        }



        let html =


        statutHTML


        +

        "<br><br>"


        +

        "<strong>👤 Proposé par : "

        +

        echange.nom

        +

        "</strong>"


        +

        "<br>"


        +

        "📅 "

        +

        echange.date_service


        +

        "<br>"


        +

        "⏰ "

        +

        echange.prise_service

        +

        " → "

        +

        echange.fin_service


        +

        "<br><br>"


        +

        "<small>"

        +

        (echange.commentaire || "")

        +

        "</small>";



        if (

            echange.statut === "disponible"

        ) {


            html +=


            '<button class="btn btn-interesse" '

            +

            'onclick="interesser('

            +

            echange.id

            +

            ', '

            +

            '\''

            +

            echange.nom.replace(/'/g, "\\'")

            +

            '\''

            +

            ')"'

            +

            '>🤝 JE SUIS INTÉRESSÉ</button>';

        }



        if (

            echange.statut === "en_cours"

            &&

            echange.agent_interesse

        ) {


            html +=


            "<br><br>"


            +

            "<strong>🤝 Agent intéressé : "

            +

            echange.agent_interesse

            +

            "</strong>";

        }



        bloc.innerHTML = html;



        zone.appendChild(bloc);


    });


}


</script>


</body>

</html>
