<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ÉCHANGE SERVICE</title>

<style>

:root {
    --bleu-fonce: #102a43;
    --bleu: #1769aa;
    --gris: #f3f6f8;
    --vert: #167242;
    --orange: #c96f00;
    --blanc: #ffffff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--gris);
    color: #17212b;
}

header {
    background: linear-gradient(135deg, var(--bleu-fonce), var(--bleu));
    color: white;
    padding: 25px 20px 35px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 8px 0 0;
    opacity: 0.9;
}

main {
    max-width: 650px;
    margin: -15px auto 90px;
    padding: 0 15px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-top: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.hidden {
    display: none !important;
}

.choice {
    width: 100%;
    padding: 22px;
    margin-top: 15px;
    border-radius: 16px;
    border: 1px solid #e0e6eb;
    background: white;
    font-size: 19px;
    font-weight: bold;
    text-align: left;
}

.choice small {
    display: block;
    margin-top: 5px;
    font-size: 14px;
    font-weight: normal;
    color: #687887;
}

button {
    cursor: pointer;
}

.btn {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    background: var(--bleu);
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.btn-interesse {
    background: var(--vert);
}

.btn-secondaire {
    background: #e8eef4;
    color: #17212b;
}

label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-top: 12px;
    color: #526273;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    margin-top: 5px;
    border-radius: 10px;
    border: 1px solid #ccd6df;
    font-size: 16px;
    background: white;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.item {
    background: #f8fafc;
    border-left: 5px solid var(--bleu);
    padding: 16px;
    margin-top: 15px;
    border-radius: 10px;
}

.badge {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.badge-disponible {
    background: #e7f5ec;
    color: var(--vert);
}

.badge-encours {
    background: #fff0d8;
    color: var(--orange);
}

.agent-interesse {
    margin-top: 15px;
    padding: 12px;
    background: #fff0d8;
    border-radius: 10px;
}

nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 1px solid #dfe6ec;
    padding: 8px;
    display: flex;
    justify-content: space-around;
}

nav button {
    border: none;
    background: none;
    font-size: 12px;
    padding: 8px;
}

</style>
</head>


<body>


<header>

<h1>🚆 ÉCHANGE SERVICE</h1>

<p>Échange de journées entre agents</p>

</header>



<main>


<!-- =========================
     ACCUEIL
========================= -->

<section id="accueil">

<div class="card">

<h2>Bienvenue 👋</h2>

<p>Choisissez votre métier pour commencer.</p>

</div>


<button
class="choice"
onclick="choisirMetier('ADC')"
>

🚆 ADC

<small>Conducteurs de train</small>

</button>


<button
class="choice"
onclick="choisirMetier('ASCT')"
>

👤 ASCT

<small>Agents du Service Commercial Train</small>

</button>

</section>



<!-- =========================
     PROPOSER
========================= -->

<section
id="proposer"
class="hidden"
>

<div class="card">

<span
id="metier"
class="badge badge-disponible"
></span>


<h2>➕ Ma journée à échanger</h2>


<label for="nom">
Nom et prénom
</label>

<input
id="nom"
placeholder="Exemple : Jean DUPONT"
autocomplete="name"
>


<label for="date">
Date de la journée
</label>

<input
id="date"
type="date"
>


<div class="row">


<div>

<label for="prise">
Prise de service
</label>

<input
id="prise"
type="time"
>

</div>


<div>

<label for="fin">
Fin de service
</label>

<input
id="fin"
type="time"
>

</div>


</div>


<label for="commentaire">
Commentaire facultatif
</label>

<textarea
id="commentaire"
placeholder="Exemple : TER, réserve..."
></textarea>


<button
class="btn"
onclick="publier()"
>

🚆 PUBLIER MA JOURNÉE

</button>


<button
class="btn btn-secondaire"
onclick="afficher('echanges')"
>

🔎 VOIR LES ÉCHANGES

</button>


</div>

</section>



<!-- =========================
     ÉCHANGES
========================= -->

<section
id="echanges"
class="hidden"
>

<div class="card">

<h2>🔎 Échanges disponibles</h2>

<p id="infoMetier"></p>


<div id="listeEchanges"></div>


<button
class="btn btn-secondaire"
onclick="afficher('proposer')"
>

➕ PROPOSER UNE JOURNÉE

</button>


</div>

</section>


</main>



<!-- =========================
     MENU BAS
========================= -->

<nav
id="menu"
class="hidden"
>


<button
onclick="afficher('proposer')"
>

➕ Ma journée

</button>


<button
onclick="afficher('echanges')"
>

🔎 Échanges

</button>


<button
onclick="changerMetier()"
>

🚆 Métier

</button>


</nav>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================================
   CONFIGURATION SUPABASE
========================================= */

const SUPABASE_URL =
"https://nptwpoguokbjuzdyxach.supabase.co";


const SUPABASE_KEY =
"sb_publishable_VxIiVyjGPVxipQx8j5njxA_YxaFOnAF";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* =========================================
   VARIABLES
========================================= */

let metierActuel = "";



/* =========================================
   NAVIGATION
========================================= */

function afficher(page) {


    document
    .querySelectorAll("main section")
    .forEach(function(section) {

        section.classList.add("hidden");

    });


    const section =
    document.getElementById(page);


    if (section) {

        section.classList.remove("hidden");

    }


    if (page === "echanges") {

        afficherEchanges();

    }

}



/* =========================================
   CHOIX DU MÉTIER
========================================= */

function choisirMetier(metier) {


    metierActuel = metier;


    document
    .getElementById("metier")
    .innerText = metier;


    document
    .getElementById("menu")
    .classList.remove("hidden");


    afficher("proposer");

}



/* =========================================
   CHANGER DE MÉTIER
========================================= */

function changerMetier() {


    metierActuel = "";


    document
    .getElementById("menu")
    .classList.add("hidden");


    afficher("accueil");

}



/* =========================================
   PUBLIER UNE JOURNÉE
========================================= */

async function publier() {


    const nom =
    document
    .getElementById("nom")
    .value
    .trim();


    const date =
    document
    .getElementById("date")
    .value;


    const prise =
    document
    .getElementById("prise")
    .value;


    const fin =
    document
    .getElementById("fin")
    .value;


    const commentaire =
    document
    .getElementById("commentaire")
    .value
    .trim();



    if (!metierActuel) {

        alert(
        "Veuillez choisir votre métier."
        );

        return;

    }



    if (

        !nom ||
        !date ||
        !prise ||
        !fin

    ) {


        alert(
        "Merci de remplir le nom, la date et les horaires."
        );

        return;

    }



    const { error } =

    await supabaseClient

    .from("echanges")

    .insert([

        {

            metier:
            metierActuel,

            nom:
            nom,

            date_service:
            date,

            prise_service:
            prise,

            fin_service:
            fin,

            commentaire:
            commentaire,

            statut:
            "disponible",

            agent_interesse:
            null

        }

    ]);



    if (error) {


        console.error(
        "Erreur Supabase :",
        error
        );


        alert(

        "Erreur lors de la publication : " +

        error.message

        );


        return;

    }



    /* VIDER LE FORMULAIRE */

    document
    .getElementById("nom")
    .value = "";


    document
    .getElementById("date")
    .value = "";


    document
    .getElementById("prise")
    .value = "";


    document
    .getElementById("fin")
    .value = "";


    document
    .getElementById("commentaire")
    .value = "";



    alert(
    "Votre journée est publiée !"
    );


    afficher("echanges");

}



/* =========================================
   JE SUIS INTÉRESSÉ
========================================= */

async function interesser(
    id,
    nomProposant
) {


    let nomAgent = prompt(

        "Entrez votre nom et prénom :"

    );


    if (!nomAgent) {

        return;

    }


    nomAgent =
    nomAgent.trim();


    if (nomAgent === "") {

        return;

    }



    /* EMPÊCHER DE RÉPONDRE
       À SA PROPRE JOURNÉE */

    if (

        nomAgent.toLowerCase()

        ===

        nomProposant
        .toLowerCase()
        .trim()

    ) {


        alert(

        "Vous ne pouvez pas répondre à votre propre proposition."

        );


        return;

    }



    /* MODIFIER LA JOURNÉE */

    const { error } =

    await supabaseClient

    .from("echanges")

    .update({

        agent_interesse:
        nomAgent,

        statut:
        "en_cours"

    })

    .eq(
        "id",
        id
    )

    .eq(
        "statut",
        "disponible"
    );



    if (error) {


        console.error(
        "Erreur Supabase :",
        error
        );


        alert(

        "Erreur lors de la réponse : " +

        error.message

        );


        return;

    }



    alert(

    "Votre intérêt pour cet échange a été enregistré !"

    );


    afficherEchanges();

}



/* =========================================
   AFFICHER LES ÉCHANGES
========================================= */

async function afficherEchanges() {


    const zone =

    document.getElementById(
        "listeEchanges"
    );


    const infoMetier =

    document.getElementById(
        "infoMetier"
    );


    infoMetier.innerHTML =

    "<strong>Métier : " +

    metierActuel +

    "</strong>";



    zone.innerHTML =

    "<p>Chargement...</p>";



    const { data, error } =

    await supabaseClient

    .from("echanges")

    .select("*")

    .eq(
        "metier",
        metierActuel
    )

    .order(
        "date_service",
        {
            ascending: true
        }
    )

    .order(
        "created_at",
        {
            ascending: false
        }
    );



    if (error) {


        console.error(
        "Erreur Supabase :",
        error
        );


        zone.innerHTML =

        "<p>❌ Erreur lors du chargement : " +

        error.message +

        "</p>";


        return;

    }



    zone.innerHTML = "";



    if (

        !data ||

        data.length === 0

    ) {


        zone.innerHTML =

        "<p>Aucune journée proposée pour le moment.</p>";


        return;

    }



    data.forEach(function(echange) {


        const bloc =

        document.createElement("div");


        bloc.className =
        "item";



        /* NORMALISER LE STATUT */

        const statut =

        String(
            echange.statut || "disponible"
        )

        .toLowerCase()

        .trim();



        /* BADGE */

        const badge =

        document.createElement("span");


        badge.className =
        "badge";



        if (

            statut === "disponible"

        ) {


            badge.classList.add(
                "badge-disponible"
            );


            badge.innerText =
            "🟢 Disponible";


        }

        else {


            badge.classList.add(
                "badge-encours"
            );


            badge.innerText =
            "🟠 Échange en cours";


        }



        bloc.appendChild(
            badge
        );



        /* ESPACEMENT */

        bloc.appendChild(
            document.createElement("br")
        );

        bloc.appendChild(
            document.createElement("br")
        );



        /* NOM */

        const nom =

        document.createElement("strong");


        nom.innerText =

        "👤 Proposé par : " +

        (echange.nom || "");


        bloc.appendChild(nom);



        bloc.appendChild(
            document.createElement("br")
        );



        /* DATE */

        const date =

        document.createElement("div");


        date.innerText =

        "📅 " +

        (echange.date_service || "");


        bloc.appendChild(date);



        /* HORAIRES */

        const horaires =

        document.createElement("div");


        horaires.innerText =

        "⏰ " +

        (echange.prise_service || "")

        +

        " → "

        +

        (echange.fin_service || "");


        bloc.appendChild(horaires);



        /* COMMENTAIRE */

        if (

            echange.commentaire

        ) {


            const commentaire =

            document.createElement("small");


            commentaire.style.display =
            "block";


            commentaire.style.marginTop =
            "10px";


            commentaire.innerText =
            echange.commentaire;


            bloc.appendChild(
                commentaire
            );

        }



        /* =================================
           BOUTON JE SUIS INTÉRESSÉ
        ================================= */

        if (

            statut === "disponible"

        ) {


            const bouton =

            document.createElement("button");


            bouton.className =

            "btn btn-interesse";


            bouton.innerText =

            "🤝 JE SUIS INTÉRESSÉ";


            bouton.onclick = function() {


                interesser(

                    echange.id,

                    echange.nom || ""

                );

            };


            bloc.appendChild(
                bouton
            );

        }



        /* =================================
           AGENT INTÉRESSÉ
        ================================= */

        if (

            statut === "en_cours"

            &&

            echange.agent_interesse

        ) {


            const agentInteresse =

            document.createElement("div");


            agentInteresse.className =

            "agent-interesse";


            agentInteresse.innerHTML =

            "<strong>🤝 Agent intéressé :</strong><br>" +

            echange.agent_interesse;


            bloc.appendChild(
                agentInteresse
            );

        }



        /* AJOUT À LA LISTE */

        zone.appendChild(
            bloc
        );


    });


}


</script>


</body>

</html>
